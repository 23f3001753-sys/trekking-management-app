{% extends "base.html" %}
{% block title %}{{ "Edit Trek" if trek else "New Trek" }}{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:640px; margin:0 auto;">
    <h3 class="mb-3">{{ "Edit Trek" if trek else "Create New Trek" }}</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Trek Name</label>
            <input type="text" name="name" class="form-control" value="{{ trek.name if trek else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" value="{{ trek.location if trek else '' }}" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Difficulty</label>
                <select name="difficulty" class="form-select">
                    {% for d in ["Easy", "Moderate", "Hard"] %}
                    <option value="{{ d }}" {% if trek and trek.difficulty == d %}selected{% endif %}>{{ d }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Duration (days)</label>
                <input type="number" min="1" name="duration_days" class="form-control" value="{{ trek.duration_days if trek else 1 }}" required>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Total Slots</label>
                <input type="number" min="1" name="total_slots" class="form-control" value="{{ trek.total_slots if trek else 10 }}" required>
            </div>
            {% if trek %}
            <div class="col-md-6 mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for s in ["Pending", "Approved", "Open", "Closed", "Completed"] %}
                    <option value="{{ s }}" {% if trek.status == s %}selected{% endif %}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control" value="{{ trek.start_date if trek else '' }}">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control" value="{{ trek.end_date if trek else '' }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ trek.description if trek else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">{{ "Save Changes" if trek else "Create Trek" }}</button>
        <a href="{{ url_for('admin.treks') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
