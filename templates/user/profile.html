{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:520px; margin:0 auto;">
    <h3 class="mb-3">My Profile</h3>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
            <div class="form-text">Email cannot be changed.</div>
        </div>
        <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="text" name="contact" class="form-control" value="{{ current_user.contact or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
        </div>
        <button type="submit" class="btn btn-success w-100">Save Changes</button>
    </form>
</div>
{% endblock %}
